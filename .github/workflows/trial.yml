name: AI Trial (no publish)

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "要測的項目，逗號分隔：pipeline（兩階段）、gemini、groq、cloudflare"
        default: "pipeline"
      mode:
        description: "模式：daily / review / preview；留空＝依今天的星期自動判斷"
        default: ""

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser requests
      - name: 試跑（只測 AI，不發布）
        run: cd scripts && python trial.py
        env:
          TRIAL_PROVIDERS:       ${{ inputs.providers }}
          EPISODE_MODE:          ${{ inputs.mode }}
          R2_PUBLIC_URL:         ${{ secrets.R2_PUBLIC_URL }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
