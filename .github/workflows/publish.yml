name: Publish Podcast Episodes

on:
  repository_dispatch:
    types: [new_episode]
  schedule:
    # v1.10.2：不必設 Worker 也能在美東 17:00（太平洋 14:00）發布。
    # 主排程在美東 16:35 開始做稿（夏令 UTC 20:35、冬令 UTC 21:35，兩個時間各有一個會因為季節不符而自動略過），
    # 做好後等到美東 17:00 才更新 feed；GitHub 排程常延遲，提早 25 分鐘開始就是為了吸收延遲。
    # 第三條 UTC 23:10 是補發保險：前面都沒發成才會動，已發布就跳過。同一個美東交易日不會重複發（guid 相同＋已發布檢查）。
    - cron: "35 20 * * *"
    - cron: "35 21 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴          # ← 新增這個 step
        run: pip install feedparser requests edge-tts boto3 tzdata

      - name: Run main script   # ← 改這裡（原來是 python scripts/publish.py）
        run: cd scripts && python main.py
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY:     ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml episodes_queue.json
          git diff --staged --quiet || git commit -m "自動發布：更新 RSS feed [skip ci]"
          git push
